<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<title>رفيق — شريك حياة رقمي</title>
<meta name="theme-color" content="#14110C"/>
<meta name="format-detection" content="telephone=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="رفيق"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%2314110C'/%3E%3Cpath d='M10 26h8l3-9 6 16 3-7h8' stroke='%23E5A83E' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#14110C;--panel:#191510;--card:#1E1912;--card2:#241E13;
 --line:#2C2517;--line2:#3B3220;
 --ink:#F1EADC;--ink2:#B0A58B;--ink3:#716750;
 --acc:#E5A83E;--acc-ink:#241B08;--acc-soft:rgba(229,168,62,.13);
 --good:#84C88E;--bad:#E4796B;
 --c-health:#84C88E;--c-relations:#E8907E;--c-money:#E2C063;--c-work:#8FBFCB;--c-mind:#B7A6DC;--c-growth:#DE9A66;
 --me-bg:#413413;--me-line:#5C4A1B;--tab-bg:rgba(20,16,11,.94);--frame:#292214;
 --fd:'Alexandria','SF Arabic',system-ui,sans-serif;
 --fb:'IBM Plex Sans Arabic','SF Arabic',system-ui,sans-serif;
}
html{color-scheme:dark;-webkit-text-size-adjust:100%}
html[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{position:fixed;top:0;left:0;right:0;bottom:0;background:#0A0906;font-family:var(--fb);color:var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:manipulation;-webkit-overflow-scrolling:touch}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;-webkit-appearance:none;appearance:none}
input,textarea,select{-webkit-appearance:none;appearance:none}
@media (hover:none){input,textarea,select{font-size:16px}}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;width:100%;height:100%}
.stage-cap{display:none;align-items:center;gap:9px;color:#8A7E62;font-size:12.5px}
.stage-cap .ic{color:var(--acc)}
@media(min-width:600px){.stage-cap{display:flex}}
#phone{position:relative;width:100%;height:100%;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;transition:background .3s}
@media(min-width:600px){
 #phone{width:430px;height:min(900px,94vh);border-radius:38px;border:1px solid var(--frame);
 box-shadow:0 60px 140px -40px rgba(0,0,0,.85),0 0 0 8px #050403}
}
#splash{position:absolute;top:0;left:0;right:0;bottom:0;z-index:95;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#splash .sp-t{font-family:var(--fd);font-weight:700;font-size:16px;color:var(--ink2)}
#splash .sp-bar{width:120px;height:4px;border-radius:100px;background:var(--card2);overflow:hidden}
#splash .sp-bar i{display:block;height:100%;width:40%;border-radius:100px;background:var(--acc);animation:sp 1.1s ease-in-out infinite}
@keyframes sp{0%{transform:translateX(60px)}100%{transform:translateX(-160px)}}
#lock{position:absolute;top:0;left:0;right:0;bottom:0;z-index:96;background:var(--bg);display:flex;align-items:center;justify-content:center}
#lock[hidden]{display:none!important}
.lk-in{display:flex;flex-direction:column;align-items:center;gap:10px;padding:30px;text-align:center}
.lk-in b{font-family:var(--fd);font-size:20px;margin-top:4px}
.lk-in p{font-size:12.5px;color:var(--ink2)}
.lk-dots{display:flex;gap:13px;margin:10px 0 20px}
.lk-dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line2);transition:.15s}
.lk-dots i.f{background:var(--acc);border-color:var(--acc)}
#lock.shake .lk-dots{animation:shk .4s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.lk-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.lk-pad button{width:62px;height:62px;border-radius:50%;border:1px solid var(--line2);font-family:var(--fd);font-size:21px;font-weight:700;color:var(--ink)}
.lk-pad button:active{background:var(--card2);transform:scale(.94)}
.lk-pad .lk-del{color:var(--ink2);font-size:14px;font-family:var(--fb);font-weight:600}
.lk-forgot{margin-top:18px;font-size:11.5px;color:var(--ink3);text-decoration:underline}
#secSheet{position:absolute;top:0;left:0;right:0;bottom:0;z-index:97;background:var(--bg);display:flex;align-items:center;justify-content:center}
#secSheet[hidden]{display:none!important}
.sec-in{padding:34px 30px;text-align:center;max-width:320px;width:100%}
.sec-in b{font-family:var(--fd);font-size:19px;display:block;margin-bottom:8px}
.sec-in p{font-size:13px;color:var(--ink2);line-height:1.8;margin-bottom:16px}
#ritual{position:absolute;top:0;left:0;right:0;bottom:0;z-index:60;background:radial-gradient(120% 90% at 50% 0%,#1E1810 0%,var(--bg) 70%);display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 30px) 26px calc(env(safe-area-inset-bottom) + 26px)}
#ritual[hidden]{display:none!important}
.rt-mid{flex:1;display:flex;flex-direction:column;justify-content:center;padding:14px 0}
.rt-ic{margin:0 auto 16px;display:block;animation:rtb 2.6s ease infinite}
@keyframes rtb{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.rt-t{font-family:var(--fd);font-size:24px;font-weight:800;text-align:center}
.rt-t em{font-style:normal;color:var(--acc)}
.rt-s{text-align:center;color:var(--ink2);font-size:13px;line-height:1.9;margin-top:9px}
.rt-sec{margin-top:20px}
.rt-lab{text-align:center;font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:10px}
.rt-faces{display:flex;gap:7px;justify-content:center}
.rt-face{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 8px;border-radius:14px;border:1.5px solid var(--line);color:var(--ink3);font-size:9.5px;transition:.18s;max-width:74px}
.rt-face.on{color:var(--acc);border-color:var(--acc);background:var(--acc-soft);animation:pop .3s ease}
.rt-face:active{transform:scale(.93)}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.rt-chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.rt-chip{padding:10px 15px;border-radius:100px;border:1.5px solid var(--line);color:var(--ink2);font-size:13px;transition:.18s}
.rt-chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
.rt-chip:active{transform:scale(.95)}
.rt-btn{display:block;width:100%;background:var(--acc);color:var(--acc-ink);font-weight:800;font-size:15.5px;border-radius:15px;padding:15px;text-align:center;margin-top:26px;transition:.15s;font-family:var(--fd)}
.rt-btn:active{transform:scale(.97)}
.rt-links{text-align:center;margin-top:16px}
.rt-links button{font-size:11.5px;color:var(--ink3);text-decoration:underline;margin:0 8px}
.rt-note{min-height:64px}
/* التقييم النفسي المقنن */
.ps-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.ps-row:last-child{border-bottom:none}
.ps-dim{width:88px;flex:none}
.ps-dim b{font-size:13px;display:block}
.ps-dim span{font-size:9px;color:var(--ink3);display:block;margin-top:1px}
.ps-track{flex:1;display:flex;gap:4px}
.ps-opt{flex:1;height:36px;border-radius:9px;border:1.5px solid var(--line2);color:var(--ink2);font-size:10px;font-weight:600;display:grid;place-items:center;transition:.15s;padding:0 2px;text-align:center;line-height:1.4}
.ps-opt.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.ps-opt:active{transform:scale(.94)}
#app{display:flex;flex-direction:column;height:100%}
#app[hidden]{display:none!important}
.app-head{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 16px) 20px 12px;border-bottom:1px solid var(--line)}
.h-brand{display:flex;align-items:center;gap:10px}
.h-brand b{font-family:var(--fd);font-size:19px;font-weight:800;letter-spacing:.3px}
.logo{width:34px;height:34px;flex:none}
.logo .lg-ekg{stroke-dasharray:34 30;animation:lgp 2.6s linear infinite}
@keyframes lgp{from{stroke-dashoffset:64}to{stroke-dashoffset:0}}
.h-title{font-family:var(--fd);font-size:17px;font-weight:700}
.h-date{font-size:11.5px;color:var(--ink2);text-align:left;line-height:1.5}
#views{position:relative;flex:1;overflow:hidden}
.view{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 18px 34px;display:none;scrollbar-width:thin;overscroll-behavior:contain}
.view.on{display:block;animation:viewIn .34s ease}
#v-chat{padding:0;overflow:hidden}
#v-chat.on{display:flex;flex-direction:column}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sec-t{display:flex;align-items:center;gap:7px;font-family:var(--fd);font-size:14.5px;font-weight:700;margin:22px 2px 11px;color:var(--ink)}
.sec-t .ic{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
#tabbar{display:flex;align-items:flex-end;border-top:1px solid var(--line);background:var(--tab-bg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:6px 6px calc(env(safe-area-inset-bottom) + 7px);position:relative;z-index:10}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 3px;color:var(--ink3);font-size:10.5px;position:relative;transition:color .2s}
.tab.on{color:var(--acc)}
.tab-add{flex:1;display:flex;justify-content:center}
.tab-add button{width:56px;height:56px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;transform:translateY(-20px);box-shadow:0 12px 26px -10px rgba(0,0,0,.55);transition:transform .15s}
.tab-add button:active{transform:translateY(-20px) scale(.92)}
.tab-dot{position:absolute;top:5px;right:calc(50% - 15px);width:8px;height:8px;border-radius:50%;background:var(--bad);display:none}
.tab-dot.show{display:block}
.greet-t{font-family:var(--fd);font-size:21px;font-weight:700;margin-top:10px}
.greet-t small{display:block;font-family:var(--fb);font-size:12.5px;font-weight:400;color:var(--ink2);margin-top:5px}
.st-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--acc);border:1px solid var(--line2);border-radius:100px;padding:4px 11px;margin-top:9px}
.st-chip .ic{color:var(--acc)}
.in-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--c-growth);border:1px dashed var(--line2);border-radius:100px;padding:4px 11px;margin-top:7px;margin-inline-end:6px}
.joy-card{margin-top:14px;background:linear-gradient(135deg,rgba(226,192,99,.12),var(--card));border:1px solid var(--c-money);border-radius:16px;padding:14px 15px;position:relative;overflow:hidden;animation:viewIn .5s ease}
.joy-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.joy-top b{font-size:12.5px;color:var(--c-money)}
.joy-q{font-size:14.5px;line-height:1.9;font-weight:500}
.joy-meta{font-size:10.5px;color:var(--ink3);margin-top:6px}
.joy-x{position:absolute;top:10px;left:10px;color:var(--ink3)}
.quest{margin-top:14px;border:1px solid var(--acc);background:var(--acc-soft);border-radius:16px;padding:13px 15px;display:flex;gap:11px;align-items:center}
.quest.done{border-color:var(--good);background:rgba(132,200,142,.1)}
.quest-ic{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line2);color:var(--acc)}
.quest.done .quest-ic{color:var(--good)}
.quest-b{flex:1;min-width:0}
.quest-b b{font-size:13px;display:block}
.quest-b p{font-size:12px;color:var(--ink2);margin-top:2px;line-height:1.6}
.quest-go{flex:none;font-size:11.5px;font-weight:700;color:var(--acc);border:1px solid var(--line2);border-radius:100px;padding:7px 12px;background:var(--card)}
.quest.done .quest-go{color:var(--good)}
.qbar{display:flex;gap:8px;margin-top:14px}
.qbar input{flex:1}
.qbar .qbtn{width:46px;height:46px;flex:none;border-radius:13px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center}
.qbar .qbtn:active{transform:scale(.93)}
.pred-wrap{margin-top:10px}
.pred-row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.pred-row::-webkit-scrollbar{display:none}
.pred-chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:100px;border:1.5px dashed var(--line2);color:var(--ink2);font-size:12px;max-width:82%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.15s}
.pred-chip .ic{color:var(--acc);flex:none}
.pred-chip:active{transform:scale(.95);border-color:var(--acc);color:var(--acc)}
.pred-empty{font-size:11.5px;color:var(--ink3);padding:4px 2px;line-height:1.8}
.int-card{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 15px}
.int-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.int-head b{font-size:13.5px}
.int-acc{font-size:11px;font-weight:700;color:var(--acc)}
.int-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.int-item:last-child{border-bottom:none}
.int-check{width:24px;height:24px;flex:none;border-radius:8px;border:1.5px solid var(--line2);display:grid;place-items:center;color:transparent;transition:.18s}
.int-check.on{background:var(--good);border-color:var(--good);color:var(--acc-ink)}
.int-txt{flex:1;min-width:0;font-size:13px;line-height:1.6}
.int-item.did .int-txt{color:var(--ink3);text-decoration:line-through}
.int-gen{font-size:9.5px;color:var(--ink3);padding:3px 8px;border:1px dashed var(--line2);border-radius:100px;flex:none}
.int-learn{margin-top:10px;font-size:11.5px;color:var(--c-growth);background:rgba(222,154,102,.08);border:1px dashed var(--c-growth);border-radius:12px;padding:9px 12px;line-height:1.8}
.int-learn b{color:var(--acc)}
.rate-card{margin-top:14px;background:linear-gradient(135deg,var(--card2),var(--card));border:1.5px solid var(--acc);border-radius:18px;padding:15px 16px}
.rate-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rate-head b{font-family:var(--fd);font-size:14.5px}
.rate-hint{font-size:10.5px;color:var(--ink3);border:1px dashed var(--line2);border-radius:100px;padding:3px 10px;flex:none}
.rate-live{margin-top:11px;text-align:center}
.rate-live-num{font-family:var(--fd);font-size:34px;font-weight:800;color:var(--acc)}
.rate-live-sub{font-size:11px;color:var(--ink2);margin-top:2px}
.rate-btn{display:block;width:100%;margin-top:12px;background:var(--acc);color:var(--acc-ink);font-weight:800;font-size:14px;border-radius:13px;padding:12px;text-align:center;font-family:var(--fd)}
.rate-done{margin-top:11px;background:var(--card);border:1px solid var(--good);border-radius:13px;padding:11px 13px}
.rate-done>b{color:var(--good);font-family:var(--fd);font-size:17px;display:block}
.gap-line{font-size:11.5px;line-height:1.8;margin-top:7px;color:var(--ink2)}
.gap-line .ic{color:var(--acc)}
.ch-card{margin-top:14px;background:linear-gradient(135deg,var(--card2),var(--card));border:1px solid var(--acc);border-radius:16px;padding:13px 15px}
.ch-top{display:flex;align-items:center;gap:10px}
.ch-top b{font-size:13.5px;display:block}
.ch-top span{font-size:11.5px;color:var(--ink2);display:block;margin-top:2px}
.ch-bar{height:8px;border-radius:100px;background:var(--card);overflow:hidden;margin-top:10px;border:1px solid var(--line)}
.ch-bar i{display:block;height:100%;background:var(--acc);border-radius:100px;transition:width .6s ease}
.ch-foot{display:flex;justify-content:space-between;align-items:center;margin-top:7px;font-size:10.5px;color:var(--ink3)}
.spk-card{margin-top:14px;background:linear-gradient(135deg,var(--card2),var(--card));border:1px solid var(--acc);border-radius:16px;padding:14px 15px}
.spk-top{display:flex;align-items:center;gap:10px}
.spk-ic{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc)}
.spk-body{flex:1;min-width:0}
.spk-body b{font-size:13.5px;display:block}
.spk-body p{font-size:12.5px;color:var(--ink2);line-height:1.7;margin-top:3px}
.spk-kind{font-size:9.5px;font-weight:700;border:1px solid var(--line2);border-radius:100px;padding:2px 8px;color:var(--ink3);flex:none}
.qa-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.qa{display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 2px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink2);font-size:10.5px;font-weight:500}
.qa .ic{color:var(--acc)}
.qa:active{transform:scale(.94)}
.story-btn{display:flex;align-items:center;gap:11px;width:100%;margin-top:14px;background:linear-gradient(135deg,var(--card2),var(--card));border:1px solid var(--acc);border-radius:16px;padding:13px 15px;text-align:right;transition:.15s}
.story-btn:active{transform:scale(.98)}
.story-btn .sb-ic{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc)}
.story-btn b{font-size:13.5px;display:block;color:var(--ink)}
.story-btn span{font-size:11px;color:var(--ink2)}
.life-card{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 16px 14px;text-align:center;position:relative;overflow:hidden;cursor:pointer;transition:border-color .2s}
.life-card:active{border-color:var(--line2)}
.lc-top{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--ink2)}
.lc-live{display:flex;align-items:center;gap:6px}
.pulse-dot{width:7px;height:7px;border-radius:50%;background:var(--good);animation:pd 1.8s ease infinite}
@keyframes pd{0%,100%{box-shadow:0 0 0 0 rgba(132,200,142,.5)}50%{box-shadow:0 0 0 5px rgba(132,200,142,0)}}
.lc-trend{font-size:12px;font-weight:600}
.lc-trend.up{color:var(--good)}.lc-trend.dn{color:var(--bad)}.lc-trend.fl{color:var(--ink3)}
.ring{width:196px;height:196px;margin:6px auto 0;display:block}
#ringArc{transition:stroke-dashoffset 1.1s cubic-bezier(.3,.8,.3,1)}
.ring-num{font-family:var(--fd);font-weight:800;font-size:37px;fill:var(--ink)}
.ring-sub{font-size:10.5px;fill:var(--ink3)}
.ekg{stroke:var(--acc);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:26 118;animation:ekgRun 2.4s linear infinite;opacity:.9}
@keyframes ekgRun{from{stroke-dashoffset:144}to{stroke-dashoffset:0}}
.lc-cap{font-size:13px;color:var(--ink2);margin-top:2px}
.lc-cap b{color:var(--ink)}
.pf-seg{display:flex;gap:6px;margin:14px 2px 10px}
.pf-seg .chip{flex:1;text-align:center;padding:7px}
.pf-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pf-box{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:10px 4px;text-align:center}
.pf-box b{font-family:var(--fd);font-size:17px;display:block}
.pf-box span{font-size:9.5px;color:var(--ink3)}
.hint-card{margin-top:14px;background:var(--card2);border:1px dashed var(--line2);border-radius:14px;padding:12px 14px;font-size:12.5px;line-height:1.9;color:var(--ink2)}

const STORES=['events','rels','decisions','chat','meta'];
const DB={driver:'mem',ok:false,_m:{},_idb:null,
 async open(){
  try{
   const db=await new Promise((res,rej)=>{
    if(typeof indexedDB==='undefined'){rej(new Error('no idb'));return}
    const r=indexedDB.open('rafiq-db',1);
    r.onupgradeneeded=e=>{const d=e.target.result;STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:s==='meta'?'key':'id'})})};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'))});
   DB._idb=db;DB.driver='idb';DB.ok=true;
   for(let i=0;i<STORES.length;i++){const s=STORES[i];
    DB._m[s]=await new Promise((res,rej)=>{const q=db.transaction(s).objectStore(s).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error)})}
   return;
  }catch(e){}
  try{
   localStorage.setItem('rafiq__probe','1');localStorage.removeItem('rafiq__probe');
   DB.driver='ls';DB.ok=true;
   STORES.forEach(s=>{try{DB._m[s]=JSON.parse(localStorage.getItem('rafiq:'+s)||'[]')}catch(e2){DB._m[s]=[]}if(!Array.isArray(DB._m[s]))DB._m[s]=[]});
   return;
  }catch(e){}
  DB.driver='mem';DB.ok=false;STORES.forEach(s=>DB._m[s]=[]);
 },
 _keyOf(s,o){return s==='meta'?o.key:o.id},
 all(s){return Promise.resolve((DB._m[s]||[]).slice())},
 async put(s,o){
  const arr=DB._m[s]||(DB._m[s]=[]);const k=DB._keyOf(s,o);
  let f=false;for(let i=0;i<arr.length;i++){if(DB._keyOf(s,arr[i])===k){arr[i]=o;f=true;break}}
  if(!f)arr.push(o);
  if(DB.driver==='idb'&&DB._idb){try{await new Promise((res,rej)=>{const q=DB._idb.transaction(s,'readwrite').objectStore(s).put(o);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)})}catch(e){}}
  else if(DB.driver==='ls')DB._lsSave(s);
  return o;
 },
 async del(s,key){
  const arr=DB._m[s]||(DB._m[s]=[]);
  for(let i=0;i<arr.length;i++){if(DB._keyOf(s,arr[i])===key){arr.splice(i,1);break}}
  if(DB.driver==='idb'&&DB._idb){try{await new Promise((res,rej)=>{const q=DB._idb.transaction(s,'readwrite').objectStore(s).delete(key);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)})}catch(e){}}
  else if(DB.driver==='ls')DB._lsSave(s);
 },
 async clear(s){
  DB._m[s]=[];
  if(DB.driver==='idb'&&DB._idb){try{await new Promise((res,rej)=>{const q=DB._idb.transaction(s,'readwrite').objectStore(s).clear();q.onsuccess=()=>res();q.onerror=()=>rej(q.error)})}catch(e){}}
  else if(DB.driver==='ls')DB._lsSave(s);
 },
 _lsSave(s){try{localStorage.setItem('rafiq:'+s,JSON.stringify(DB._m[s]||[]))}catch(e){}}
};

 return bk;
}

function lifeAt(until){const v=CATS.map(c=>catScoreAt(c,until));return Math.round(v.reduce((a,b)=>a+b,0)/v.length)}
function calcStreak(){

 if(!S.events.some(e=>dayStart(e.ts)===d0))d0-=DAY;
 while(S.events.some(e=>dayStart(e.ts)===d0)){st++;d0-=DAY}

}

 /* fingerprint-engine — محرك بصمة الشخصية الثمانية 3.1 */
function fpCompute(){
 const stats={};FP_DIMS.forEach(d=>stats[d.id]={pos:0,neg:0});
 const evs=S.events.filter(e=>e.type!=='mood'&&e.type!=='promise'&&e.type!=='selfrate'&&e.type!=='interest');
 evs.forEach(e=>{
  const s=' '+e.text+' ';
  const w=daysSince(e.ts)<30?2:1;
  FP_DIMS.forEach(d=>{
   d.pos.forEach(k=>{if(s.indexOf(k)>=0)stats[d.id].pos+=w});
   d.neg.forEach(k=>{if(s.indexOf(k)>=0)stats[d.id].neg+=w});
  });
 });
 const moods=S.events.filter(e=>e.type==='mood');
 moods.forEach(e=>{if(e.mood>=5)stats.emot.pos+=1;else if(e.mood<=2)stats.emot.neg+=1});
 const rates=S.events.filter(e=>e.type==='selfrate');
 rates.forEach(e=>{if(e.ps){if(e.ps.joy>=4)stats.emot.pos+=1;if(e.ps.anger>=4||e.ps.anx>=4)stats.emot.neg+=1;if(e.ps.helped>=4)stats.empath.pos+=2;if(e.ps.mind>=4)stats.depth.pos+=1}});
 FP_DIMS.forEach(d=>{
  const tot=stats[d.id].pos+stats[d.id].neg;
  stats[d.id].score=tot===0?50:Math.round(stats[d.id].pos/tot*100);
 });
 return stats;
}

/* memSearch — محرك ذاكرة رفيق: يقرأ أحداثك فيجيب من سجلاتك 3.2 */
function memSearch(query){
 const s=query.trim();
 const AR=LANG==='ar';
 const now=new Date();
 let days=[];
 const dm=s.match(/(\d+)\s*(يوم|days?)/);
 const dayNames=[['اليوم','today',0],['أمس','yesterday',1],['اول امس','today-2',2]];
 let target=null;
 if(/اليوم|today/i.test(s))target=dayStart(Date.now());
 else if(/أمس|امس|البارحة|yesterday/i.test(s))target=dayStart(Date.now()-DAY);
 else if(dm){const n2=parseInt(dm[1]);target=dayStart(Date.now()-n2*DAY)}
 else{for(const[w,en,off]of dayNames){if(s.indexOf(w)>=0||s.toLowerCase().indexOf(en)>=0){target=dayStart(Date.now()-off*DAY);break}}}
 if(target){const ds=dayStart(target);
  return S.events.filter(e=>dayStart(e.ts)===ds).sort((a,b)=>a.ts-b.ts);}
 const kw=classify(s)||null;
 const posW=POS.filter(w=>s.indexOf(w)>=0).length;
 const negW=NEG.filter(w=>s.indexOf(w)>=0).length;
 let hits=S.events.filter(e=>{
  if(e.type==='promise'||e.type==='interest')return false;
  if(kw&&e.category!==kw)return false;
  if(e.text&&s.split(' ').some(w=>w.length>3&&e.text.indexOf(w)>=0))return true;
  return false;
 }).sort((a,b)=>b.ts-a.ts).slice(0,6);
 if(!hits.length&&posW>0)hits=S.events.filter(e=>e.polarity>0).sort((a,b)=>b.ts-a.ts).slice(0,5);
 if(!hits.length&&negW>0)hits=S.events.filter(e=>e.polarity<0).sort((a,b)=>b.ts-a.ts).slice(0,5);
 return hits;
}
function memAnswer(query){
 const hits=memSearch(query);
 const AR=LANG==='ar';
 if(!hits.length)return null;
 const target=hits[0];
 let out='';
 if(hits.length===1){
  out=(AR?('في '+fmtDate(target.ts)+' سجلتَ: «'+hits[0].text+'» — '+cn(hits[0].category)):(hits[0].text+' on '+fmtDate(target.ts)+' — '+cn(hits[0].category)));
 }else{
  out=(AR?('وجدتُ '+hits.length+' ذكريات مرتبطة — أهمها:'):('I found '+hits.length+' related memories:'))+'\n';
  hits.slice(0,4).forEach((e,i)=>out+=(i+1)+'. '+e.text+' — '+(AR?'قبل ':'')+daysSince(e.ts)+' '+pd(daysSince(e.ts))+' · '+cn(e.category)+'\n');
 }
 const moodNear=S.events.filter(e=>e.type==='mood'&&Math.abs(dayStart(e.ts)-dayStart(target.ts))<3*DAY);
 if(moodNear.length)out+='\n'+(AR?('مزاجك في تلك الفترة: '+mw(moodNear[0].mood)):('Your mood then: '+mw(moodNear[0].mood)));
 return out;
}

/* التنبؤ الذكي */
function smartPredictions(n){
 n=n||4;
 const now=new Date(),dow=now.getDay(),hp=now.getHours();
 const part=hp<12?'m':hp<18?'a':'e';
 const acts=S.events.filter(e=>e.type!=='mood'&&e.type!=='promise'&&e.type!=='selfrate'&&e.type!=='interest'&&e.type!=='assessment'&&(e.text||'').length>0);
 if(acts.length<3)return [];
 const grp={};
 acts.forEach(e=>{
  const kw=topKeyword(e.text);
  const key=kw||('tx:'+e.text);
  if(!grp[key])grp[key]={n:0,best:null,bestSc:-1};
  const g=grp[key];g.n++;
  let sc=1;const d=new Date(e.ts);
  if(d.getDay()===dow)sc+=2;
  const p=d.getHours()<12?'m':d.getHours()<18?'a':'e';
  if(p===part)sc+=1.5;
  if(daysSince(e.ts)<=14)sc+=1;
  if(e.polarity>0)sc+=0.5;
  if(sc>g.bestSc||!g.best){g.bestSc=sc;g.best=e}
 });
 return Object.keys(grp).map(k=>grp[k])
  .filter(g=>g.n>=2||g.bestSc>=3.5)
  .sort((a,b)=>(b.n*b.bestSc)-(a.n*a.bestSc))
  .slice(0,n).map(g=>g.best);
}

function buildStory(range){
 const days=range==='week'?7:30;
 const start=dayStart(Date.now())-(days-1)*DAY;
 const evs=S.events.filter(e=>e.ts>=start&&e.type!=='mood'&&e.type!=='promise'&&e.type!=='selfrate'&&e.type!=='interest').sort((a,b)=>a.ts-b.ts);
 const AR=LANG==='ar';
 if(evs.length<2)return null;
 const pos=evs.filter(e=>e.polarity>0);
 const neg=evs.filter(e=>e.polarity<0);
 const moods=S.events.filter(e=>e.type==='mood'&&e.ts>=start);
 const avg=moods.length?moods.reduce((a,e)=>a+e.mood,0)/moods.length:null;
 const best=pos.length?(pos.reduce((a,b)=>((b.mood||0)>(a.mood||0)?b:a))):null;
 const rel=pos.filter(e=>e.category==='relations');
 const human=rel.length?rel[rel.length-1]:null;
 const grw=pos.filter(e=>e.category==='growth');
 const grow=grw.length?grw[grw.length-1]:null;
 const name=S.profile.name||(AR?'صديقي':'friend');
 const period=range==='week'?t('story_week'):t('story_month');
 let s='';
 s+='«'+t('story_t')+period+'»\n\n';
 s+=(AR?('يا '+name+'، خُضت خلال هذه الفترة '+(evs.length)+' لحظة موثقة'):('Dear '+name+', you lived '+(evs.length)+' documented moments'));
 if(avg)s+=(AR?('، ومزاجك العام كان «'+mw(Math.round(avg))+'»'):(', your mood was "'+mw(Math.round(avg))+'"'));
 s+='.\n\n';
 if(best)s+=(AR?('أجمل لحظة كانت حين «'+best.text+'» — يوم '+fmtShort(best.ts)+'.'):('Most beautiful: "'+best.text+'".'))+'\n';
 if(human&&(!best||human.id!==best.id))s+=(AR?('وقلبك كان في مكانه حين «'+human.text+'».\n'):('Your heart was right when "'+human.text+'".\n'));
 if(neg.length){const heavy=neg[0];
  s+=(AR?('وما يومٌ بلا ثقل: «'+heavy.text+'». لكنك عادت للضوء بعده.\n'):('No week without weight. But you returned to light.\n'));}
 if(grow&&(!best||grow.id!==best.id))s+=(AR?('ونموك لم يتوقف: «'+grow.text+'».\n'):('Your growth never paused.\n'));
 s+='\n'+(AR?('الخلاصة: '+lifeWord(S.life)+' — مؤشر حياتك '+S.life+'/100.'):('In sum: '+S.life+'/100.'));
 s+='\n\n'+t('story_sign');
 return s;
}

function hexSvg(){
 const cx=160,cy=150,r=104;
 const ringPts=k=>CATS.map((c,i)=>{const a=(-90+i*60)*Math.PI/180;return (cx+r*k*Math.cos(a)).toFixed(1)+','+(cy+r*k*Math.sin(a)).toFixed(1)}).join(' ');
 const sorted=[].slice.call(CATS).sort((a,b)=>S.ind[b]-S.ind[a]);
 const cA=CAT_META[sorted[0]].color;
 const cB=CAT_META[sorted[2]].color;
 const cC=CAT_META[sorted[4]].color;
 const defs='<defs>'+
  '<linearGradient id="hexPulseG" x1="0%" y1="0%" x2="100%" y2="100%">'+
   '<stop offset="0%" stop-color="'+cA+'" stop-opacity=".38"/>'+
   '<stop offset="50%" stop-color="'+cB+'" stop-opacity=".30"/>'+
   '<stop offset="100%" stop-color="'+cC+'" stop-opacity=".22"/>'+
  '</linearGradient>'+
  '<linearGradient id="hexSpinG" gradientUnits="userSpaceOnUse" x1="'+cx+'" y1="'+cy+'" x2="'+(cx+2*r)+'" y2="'+cy+'">'+
   '<stop offset="0%" stop-color="'+cA+'" stop-opacity=".45"/>'+
   '<stop offset="33%" stop-color="'+cB+'" stop-opacity=".35"/>'+
   '<stop offset="66%" stop-color="'+cC+'" stop-opacity=".30"/>'+
   '<stop offset="100%" stop-color="'+cA+'" stop-opacity=".45"/>'+
  '</linearGradient>'+
  '</defs>';
  '<linearGradient id="hexPulseG" x1="0%" y1="0%" x2="100%" y2="100%">'+
   '<stop offset="0%" stop-color="'+cA+'" stop-opacity=".38"/>'+
   '<stop offset="50%" stop-color="'+cB+'" stop-opacity=".30"/>'+
   '<stop offset="100%" stop-color="'+cC+'" stop-opacity=".22"/>'+
  '</linearGradient>'+
  '<linearGradient id="hexSpinG" x1="0%" y1="0%" x2="100%" y2="0%">'+
   '<stop offset="0%" stop-color="'+cA+'" stop-opacity="0"/>'+
   '<stop offset="45%" stop-color="'+cA+'" stop-opacity=".35"/>'+
   '<stop offset="55%" stop-color="'+cC+'" stop-opacity=".35"/>'+
   '<stop offset="100%" stop-color="'+cC+'" stop-opacity="0"/>'+
  '</linearGradient>'+
  '</defs>';
 const grid=[1,.66,.33].map(k=>'<polygon points="'+ringPts(k)+'" fill="none" stroke="var(--line)" stroke-width="1" opacity=".8"/>').join('');
 const labels=CATS.map((c,i)=>{const a=(-90+i*60)*Math.PI/180;return '<text x="'+(cx+(r+21)*Math.cos(a)).toFixed(1)+'" y="'+(cy+(r+21)*Math.sin(a)+4).toFixed(1)+'" fill="'+CAT_META[c].color+'" class="hex-lab">'+cn(c)+'</text>'}).join('');
 return '<svg viewBox="0 0 320 300" class="hex">'+defs+
  '<g id="hexSpinWrap"><rect id="hexSpinRect" x="'+(cx-r-6)+'" y="'+(cy-r-6)+'" width="'+(2*r+12)+'" height="'+(2*r+12)+'" fill="url(#hexSpinG)" opacity="0" pointer-events="none"/></g>'+
  grid+
  '<polygon id="hexPoly" class="hex-val"/>'+
  CATS.map((c,i)=>'<circle id="hexDot'+i+'" r="4" fill="'+CAT_META[c].color+'"/>').join('')+
  labels+'</svg>';
}
function drawHex(vals){
 const cx=160,cy=150,r=104;
 const pts=vals.map((v2,i)=>{const a=(-90+i*60)*Math.PI/180,rr=r*v2/100;return [cx+rr*Math.cos(a),cy+rr*Math.sin(a)]});
 const poly=$('#hexPoly');if(poly)poly.setAttribute('points',pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' '));
 pts.forEach((p,i)=>{const d=$('#hexDot'+i);if(d){d.setAttribute('cx',p[0].toFixed(1));d.setAttribute('cy',p[1].toFixed(1))}});
}
function hexTween(from,to){
 const t0=performance.now(),dur=800;
 (function f(tm){const k=Math.min(1,(tm-t0)/dur),e=1-Math.pow(1-k,3);
  drawHex(from.map((f0,i)=>f0+(to[i]-f0)*e));if(k<1)requestAnimationFrame(f)})(t0);
}
function sparkSvg(arr){
 const w=300,h=72,pad=7,mn=Math.min.apply(null,arr)-3,mx=Math.max.apply(null,arr)+3;
 const xs=i=>pad+i*(w-2*pad)/(arr.length-1),ys=v2=>h-pad-(v2-mn)*(h-2*pad)/(mx-mn);
 const pts=arr.map((v2,i)=>xs(i).toFixed(1)+','+ys(v2).toFixed(1));
 return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%"><polygon points="'+pad+','+(h-pad)+' '+pts.join(' ')+' '+(w-pad)+','+(h-pad)+'" fill="var(--acc-soft)"/><polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--acc)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+xs(arr.length-1).toFixed(1)+'" cy="'+ys(arr[arr.length-1]).toFixed(1)+'" r="4" fill="var(--acc)"/></svg>';
}

/* ====== 3.3 النبض التنبؤي — محركات: predictPulse, burnoutScore, hiddenCorr, dualMirror ====== */
function predictPulse(){
 const days=[];
 let st=calcStreak();
 for(let i=-6;i<=7;i++){
  const d0=dayStart(Date.now()+i*DAY);
  const evs=S.events.filter(e=>dayStart(e.ts)===d0);
  let mood=null;
  const mm=evs.filter(e=>e.type==='mood');
  if(mm.length)mood=Math.round(mm.reduce((a,e)=>a+e.mood,0)/mm.length);
  const acts=evs.filter(e=>e.type!=='mood'&&e.type!=='promise'&&e.type!=='selfrate'&&e.type!=='interest');
  const pos=acts.filter(e=>e.polarity>0).length,neg=acts.filter(e=>e.polarity<0).length;
  const rate=evs.find(e=>e.type==='selfrate');
  let val;
  if(mood!==null)val=Math.round(mood*100/6);
  else if(rate)val=(typeof rate.rate==='number')?rate.rate:rateScore(rate);
  else if(acts.length)val=clamp(50+(pos-neg)*10,20,90);
  else val=null;
  const dw=new Date(d0).getDay();
  const wdAvg=(function(){const all=S.events.filter(e=>e.polarity>0&&new Date(e.ts).getDay()===dw).length;const tot=S.events.filter(e=>e.polarity!==0&&new Date(e.ts).getDay()===dw).length||1;return 50+Math.round((all/tot-0.5)*40)})();
  days.push({d0:d0,dayIdx:new Date(d0).getDay(),val:val,real:i<0||i===0,future:i>0,acts:acts.length,wdAvg:wdAvg});
 }
 let last=days.filter(d=>d.val!==null&&d.real).map(d=>d.val);
 let base=last.length?last[last.length-1]:S.life;
 days.forEach(d=>{if(d.future&&d.val===null){d.val=clamp(Math.round(base*.55+d.wdAvg*.45),15,95);base=d.val}});
 return days;
}
function burnoutScore(){
 let sc=15;
 const now=Date.now();
 const sl=S.events.filter(e=>e.type==='mood'&&e.ts>now-5*DAY);
 if(sl.length){const avg=sl.reduce((a,e)=>a+e.mood,0)/sl.length;if(avg<=2.5)sc+=25;else if(avg<=3.5)sc+=12}
 const st=calcStreak();
 if(st>=12)sc+=15;else if(st>=8)sc+=8;

function fileToDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
function fileToText(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsText(f)})}
async function compressImage(dataURL,max,q){
 max=max||1000;q=q||.72;
 const img=new Image();
 await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=dataURL});
 let w=img.width,h=img.height;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
 const c=document.createElement('canvas');c.width=w;c.height=h;
 c.getContext('2d').drawImage(img,0,0,w,h);
 return c.toDataURL('image/jpeg',q);
}

function startVoice(){
 const evText=$('#evText');if(!evText)return;
 const mb=$('#micBtn');
 if(mb&&mb.classList.contains('on')){try{if(window.__rfRec)window.__rfRec.stop()}catch(e){}return}
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){toast(t('voice_bad'),'var(--acc)','mic');return}
 const mh=$('#micHint');
 try{
  const r=new SR();
  window.__rfRec=r;
  r.lang=LANG==='ar'?'ar-SA':'en-US';
  r.continuous=true;
  r.interimResults=true;
  r.maxAlternatives=1;
  let base=evText.value.trim()?evText.value.trim()+' ':'';
  if(mb)mb.classList.add('on');
  if(mh)mh.textContent=t('voice_on');
  r.onresult=e=>{
   let fin='',inter='';
   for(let i=e.resultIndex;i<e.results.length;i++){
    if(e.results[i].isFinal)fin+=e.results[i][0].transcript+' ';
    else inter+=e.results[i][0].transcript;
   }
   if(fin)base+=fin;
   evText.value=(base+inter).replace(/\s+/g,' ').trim();
   evText.dispatchEvent(new Event('input'));
  };
  r.onend=()=>{
   if(mb)mb.classList.remove('on');
   if(mh)mh.textContent=t('voice')+' — '+(LANG==='ar'?'اضغط وتحدث':'tap and speak');
   window.__rfRec=null;
  };
  r.onerror=()=>{
   if(mb)mb.classList.remove('on');
   if(mh)mh.textContent=t('voice_err');
   window.__rfRec=null;
  };
  r.start();
 }catch(err){toast(t('voice_bad'),'var(--acc)','mic')}
}

async function exportBackup(){
 const data={app:'rafiq',version:9,owner:'مراد الحاج · mouradalhaj@gmail.com',exportedAt:new Date().toISOString(),
  events:S.events,rels:S.rels,decisions:S.decisions,chat:S.chat,
  meta:{profile:S.profile,reminders:S.reminders,seeded:S.seeded,settings:S.settings}};
 const txt=JSON.stringify(data,null,2);
 try{
  const file=new File([txt],'rafiq-backup.json',{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
   await navigator.share({files:[file],title:'rafiq-backup.json'});
   toast(t('exp_share'),'var(--good)','download');return;
  }
 }catch(err){if(err&&err.name==='AbortError')return}
 const blob=new Blob([txt],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rafiq-backup.json';
 document.body.appendChild(a);a.click();
 setTimeout(()=>{if(a.parentNode)a.parentNode.removeChild(a);URL.revokeObjectURL(a.href)},4000);
 toast(t('exp_ok'),'var(--good)','download');
}
 $('#importFile').addEventListener('change',async e=>{

  const data=JSON.parse(await fileToText(f));
  if(!data.app||!Array.isArray(data.events))throw new Error('bad');
  const sts=['events','rels','decisions','chat'];
  for(let i=0;i<sts.length;i++)await DB.clear(sts[i]);
  for(const ev of data.events)await DB.put('events',ev);
  for(const r of (data.rels||[]))await DB.put('rels',r);
  for(const d of (data.decisions||[]))await DB.put('decisions',d);
  for(const c of (data.chat||[]))await DB.put('chat',c);
  if(data.meta)await DB.put('meta',{key:'main',profile:data.meta.profile||{},reminders:data.meta.reminders||[],seeded:data.meta.seeded,settings:data.meta.settings});
  S.settings=Object.assign({lang:'ar',theme:'dark',accent:'amber',toggles:{rel:true,habits:true},a2hsDone:false,pin:'',pinOn:false,secQ:'',secA:'',ritualM:'',ritualE:'',ritualOff:false,intent:null,challenge:null,joyOpen:''},(data.meta&&data.meta.settings)||{});

 e.target.value='';
});
