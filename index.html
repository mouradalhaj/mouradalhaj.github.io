<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<title>رفيق — شريك حياة رقمي</title>
<meta name="theme-color" content="#14110C"/>
<meta name="format-detection" content="telephone=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="رفيق"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%2314110C'/%3E%3Cpath d='M10 26h8l3-9 6 16 3-7h8' stroke='%23E5A83E' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#14110C;--panel:#191510;--card:#1E1912;--card2:#241E13;
 --line:#2C2517;--line2:#3B3220;
 --ink:#F1EADC;--ink2:#B0A58B;--ink3:#716750;
 --acc:#E5A83E;--acc-ink:#241B08;--acc-soft:rgba(229,168,62,.13);
 --good:#84C88E;--bad:#E4796B;
 --c-health:#84C88E;--c-relations:#E8907E;--c-money:#E2C063;--c-work:#8FBFCB;--c-mind:#B7A6DC;--c-growth:#DE9A66;
 --me-bg:#413413;--me-line:#5C4A1B;--tab-bg:rgba(20,16,11,.94);--frame:#292214;
 --fd:'Alexandria','SF Arabic',system-ui,sans-serif;
 --fb:'IBM Plex Sans Arabic','SF Arabic',system-ui,sans-serif;
}
html{color-scheme:dark;-webkit-text-size-adjust:100%}
html[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{position:fixed;top:0;left:0;right:0;bottom:0;background:#0A0906;font-family:var(--fb);color:var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:manipulation;-webkit-overflow-scrolling:touch}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;-webkit-appearance:none;appearance:none}
input,textarea,select{-webkit-appearance:none;appearance:none}
@media (hover:none){input,textarea,select{font-size:16px}}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;width:100%;height:100%}
.stage-cap{display:none;align-items:center;gap:9px;color:#8A7E62;font-size:12.5px}
@media(min-width:600px){.stage-cap{display:flex}}
#phone{position:relative;width:100%;height:100%;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@media(min-width:600px){
 #phone{width:430px;height:min(900px,94vh);border-radius:38px;border:1px solid var(--frame);
 box-shadow:0 60px 140px -40px rgba(0,0,0,.85),0 0 0 8px #050403}
}
#splash{position:absolute;top:0;left:0;right:0;bottom:0;z-index:95;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#splash .sp-t{font-family:var(--fd);font-weight:700;font-size:16px;color:var(--ink2)}
#splash .sp-bar{width:120px;height:4px;border-radius:100px;background:var(--card2);overflow:hidden}
#splash .sp-bar i{display:block;height:100%;width:40%;border-radius:100px;background:var(--acc);animation:sp 1.1s ease-in-out infinite}
@keyframes sp{0%{transform:translateX(60px)}100%{transform:translateX(-160px)}}
#lock{position:absolute;top:0;left:0;right:0;bottom:0;z-index:96;background:var(--bg);display:flex;align-items:center;justify-content:center}
#lock[hidden]{display:none!important}
.lk-in{display:flex;flex-direction:column;align-items:center;gap:10px;padding:30px;text-align:center}
.lk-in b{font-family:var(--fd);font-size:20px;margin-top:4px}
.lk-in p{font-size:12.5px;color:var(--ink2)}
.lk-dots{display:flex;gap:13px;margin:10px 0 20px}
.lk-dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line2);transition:.15s}
.lk-dots i.f{background:var(--acc);border-color:var(--acc)}
#lock.shake .lk-dots{animation:shk .4s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.lk-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.lk-pad button{width:62px;height:62px;border-radius:50%;border:1px solid var(--line2);font-family:var(--fd);font-size:21px;font-weight:700;color:var(--ink)}
.lk-pad button:active{background:var(--card2);transform:scale(.94)}
.lk-pad .lk-del{color:var(--ink2);font-size:14px;font-family:var(--fb);font-weight:600}
.lk-forgot{margin-top:18px;font-size:11.5px;color:var(--ink3);text-decoration:underline}
#secSheet{position:absolute;top:0;left:0;right:0;bottom:0;z-index:97;background:var(--bg);display:flex;align-items:center;justify-content:center}
#secSheet[hidden]{display:none!important}
.sec-in{padding:34px 30px;text-align:center;max-width:320px;width:100%}
.sec-in b{font-family:var(--fd);font-size:19px;display:block;margin-bottom:8px}
.sec-in p{font-size:13px;color:var(--ink2);line-height:1.8;margin-bottom:16px}
#ritual{position:absolute;top:0;left:0;right:0;bottom:0;z-index:60;background:radial-gradient(120% 90% at 50% 0%,#1E1810 0%,var(--bg) 70%);display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 30px) 26px calc(env(safe-area-inset-bottom) + 26px)}
#ritual[hidden]{display:none!important}
.rt-mid{flex:1;display:flex;flex-direction:column;justify-content:center;padding:14px 0}
.rt-ic{margin:0 auto 16px;display:block}
.rt-t{font-family:var(--fd);font-size:24px;font-weight:800;text-align:center}
.rt-s{text-align:center;color:var(--ink2);font-size:13px;line-height:1.9;margin-top:9px}
.rt-btn{display:block;width:100%;background:var(--acc);color:var(--acc-ink);font-weight:800;font-size:15.5px;border-radius:15px;padding:15px;text-align:center;margin-top:26px;transition:.15s;font-family:var(--fd)}
.rt-btn:active{transform:scale(.97)}
.rt-links{text-align:center;margin-top:16px}
.rt-links button{font-size:11.5px;color:var(--ink3);text-decoration:underline;margin:0 8px}
.ps-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.ps-row:last-child{border-bottom:none}
.ps-dim{width:88px;flex:none}
.ps-dim b{font-size:13px;display:block}
.ps-dim span{font-size:9px;color:var(--ink3);display:block;margin-top:1px}
.ps-track{flex:1;display:flex;gap:4px}
.ps-opt{flex:1;height:36px;border-radius:9px;border:1.5px solid var(--line);color:var(--ink3);font-size:9px;font-weight:600;display:grid;place-items:center;transition:.15s;padding:0 2px;text-align:center}
.ps-opt.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.ps-opt:active{transform:scale(.94)}
#app{display:flex;flex-direction:column;height:100%}
#app[hidden]{display:none!important}
.app-head{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 16px) 20px 12px;border-bottom:1px solid var(--line)}
.h-brand{display:flex;align-items:center;gap:10px}
.h-brand b{font-family:var(--fd);font-size:19px;font-weight:800;letter-spacing:.3px}
.logo{width:34px;height:34px;flex:none}
.logo .lg-ekg{stroke-dasharray:34 30;animation:lgp 2.6s linear infinite}
@keyframes lgp{from{stroke-dashoffset:64}to{stroke-dashoffset:0}}
.h-title{font-family:var(--fd);font-size:17px;font-weight:700}
.h-date{font-size:11.5px;color:var(--ink2);text-align:left;line-height:1.5}
#views{position:relative;flex:1;overflow:hidden}
.view{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 18px 34px;display:none;scrollbar-width:thin;overscroll-behavior:contain}
.view.on{display:block;animation:viewIn .34s ease}
#v-chat{padding:0;overflow:hidden}
#v-chat.on{display:flex;flex-direction:column}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sec-t{display:flex;align-items:center;gap:7px;font-family:var(--fd);font-size:14.5px;font-weight:700;margin:22px 2px 11px;color:var(--ink)}
.sec-t .ic{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
/* ====== الومضة 3.0 ====== */
.w-wrap{padding-top:14px;display:flex;flex-direction:column;min-height:100%}
.w-line{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 17px;font-size:15px;line-height:2;font-weight:500;animation:viewIn .4s ease}
.w-line b{color:var(--acc)}
.w-btn-wrap{margin-top:22px}
.w-btn{display:block;width:100%;background:var(--acc);color:var(--acc-ink);font-family:var(--fd);font-weight:800;font-size:18px;border-radius:20px;padding:22px;text-align:center;transition:.15s;box-shadow:0 14px 34px -14px rgba(0,0,0,.6)}
.w-btn:active{transform:scale(.97)}
.w-btn.done{background:var(--card);color:var(--good);border:1.5px solid var(--good);box-shadow:none;font-size:16px}
.w-guide{margin-top:18px;background:var(--card);border:1px solid var(--acc);border-radius:16px;padding:13px 15px}
.w-guide.g-done{border-color:var(--good)}
.wg-top{display:flex;align-items:flex-start;gap:10px}
.wg-ic{width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc)}
.wg-b{flex:1;min-width:0}
.wg-b em{font-style:normal;font-size:10px;color:var(--ink3);display:block}
.wg-b b{font-size:13.5px;display:block;margin-top:3px;line-height:1.7}
.wg-b span{font-size:11px;color:var(--ink3);display:block;margin-top:3px}
.wg-acts{display:flex;gap:8px;margin-top:10px}
.wg-acts button{flex:1;font-size:12px;font-weight:700;border-radius:11px;padding:9px;border:1px solid var(--line2);color:var(--ink2)}
.wg-acts .ok{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.w-status{margin-top:auto;padding:16px 4px 8px;display:flex;align-items:center;justify-content:center;gap:14px;font-size:11.5px;font-weight:600;color:var(--ink2)}
.w-status span{display:inline-flex;align-items:center;gap:5px}
.w-status .ic{color:var(--acc)}
#tabbar{display:flex;border-top:1px solid var(--line);background:var(--tab-bg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:6px 10px calc(env(safe-area-inset-bottom) + 8px);position:relative;z-index:10;gap:8px}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 4px;color:var(--ink3);font-size:10.5px;border-radius:14px;transition:color .2s}
.tb.on{color:var(--acc);background:var(--acc-soft)}
.tab-dot{position:absolute;top:4px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--bad);display:none}
.tab-dot.show{display:block}
/* ====== لوحة الحوار المنزلقة ====== */
#spWrap{position:absolute;top:0;left:0;right:0;bottom:0;z-index:55;background:rgba(8,6,3,.5);display:none}
#spWrap.show{display:block}
.sp-sheet{position:absolute;left:0;right:0;bottom:0;top:16%;background:var(--panel);border-top:1px solid var(--line2);border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:spUp .35s cubic-bezier(.3,.9,.3,1)}
@keyframes spUp{from{transform:translateY(100%)}to{transform:none}}
.sp-grip2{width:44px;height:4.5px;border-radius:100px;background:var(--line2);margin:10px auto 0}
.sp-head{display:flex;align-items:center;gap:10px;padding:10px 18px 10px;border-bottom:1px solid var(--line)}
.sp-av{width:36px;height:36px;flex:none;border-radius:50%;background:var(--card2);border:1.5px solid var(--acc);display:grid;place-items:center;color:var(--acc)}
.sp-head b{font-family:var(--fd);font-size:14px;display:block}
.sp-head span{font-size:10px;color:var(--ink3)}
.sp-x{margin-inline-start:auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);color:var(--ink2)}
#spMsgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:13px 15px 5px;scrollbar-width:none}
#spMsgs::-webkit-scrollbar{display:none}
.sp-msg{max-width:86%;padding:9px 13px;border-radius:15px;font-size:13px;line-height:1.8;margin-bottom:8px;white-space:pre-wrap;word-break:break-word}
.sp-msg.rf{margin-left:auto;background:var(--card2);border:1px solid var(--line);border-top-right-radius:4px}
.sp-msg.me{margin-right:auto;background:var(--me-bg);border:1px solid var(--me-line);border-top-left-radius:4px}
.sp-acts{display:flex;gap:7px;flex-wrap:wrap;padding:2px 2px 10px}
.sp-acts button{font-size:11.5px;font-weight:700;color:var(--acc);border:1px solid var(--line2);border-radius:100px;padding:7px 13px}
.sp-acts button:active{transform:scale(.95)}
.sp-rate{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin:4px 2px 10px}
.sp-rate h5{font-size:10.5px;color:var(--ink3);font-weight:500;margin-bottom:6px}
.ps-mini{display:flex;align-items:center;gap:8px;padding:3px 0}
.ps-mini>span{width:48px;font-size:10px;color:var(--ink2);flex:none}
.ps-mini .ps-track2{flex:1;height:7px;border-radius:100px;background:var(--card2);overflow:hidden}
.ps-mini .ps-track2 i{display:block;height:100%;border-radius:100px}
.ps-mini em{font-size:9.5px;font-style:normal;width:30px;text-align:left;color:var(--ink2);flex:none}
.sp-done{margin:6px 2px 10px;background:var(--card);border:1px solid var(--good);border-radius:14px;padding:12px 14px;text-align:center}
.sp-done b{color:var(--good);font-family:var(--fd);font-size:15px}
.sp-done p{font-size:11.5px;color:var(--ink2);margin-top:4px}
.sp-introw{display:flex;gap:7px;padding:4px 2px 10px}
.sp-introw input{flex:1;font-size:12.5px;padding:9px 12px}
.sp-introw button{flex:none;width:40px;border-radius:11px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center}
.sp-composer{display:flex;gap:8px;align-items:center;padding:10px 13px calc(env(safe-area-inset-bottom) + 12px);border-top:1px solid var(--line)}
.sp-composer input{flex:1}
.sp-send{width:42px;height:42px;flex:none;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center}
.sp-send:active{transform:scale(.9)}
/* بقية الشاشات */
.rel-sum{margin-top:14px;font-size:13px;color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 15px;line-height:1.8}
.rel-sum b{color:var(--ink)}
.rel{display:flex;gap:12px;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line)}
.rel-av{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--fd);font-weight:700;font-size:17px;color:var(--rc);background:var(--card);border:1.5px solid var(--rc)}
.rel-b{flex:1;min-width:0}
.rel-b b{font-size:14.5px;display:block}
.rel-b span{font-size:11.5px;color:var(--ink3)}
.rel-bar{height:4px;border-radius:100px;background:var(--card2);margin-top:7px;overflow:hidden}
.rel-bar i{display:block;height:100%;border-radius:100px;background:var(--rc);transition:width .9s ease}
.rel-cnt{display:inline-flex;align-items:center;gap:5px;margin-top:7px;font-size:10.5px;font-weight:600;color:var(--ink2);border:1px dashed var(--line2);border-radius:100px;padding:3px 10px}
.rel-acts{display:flex;gap:6px;flex:none;flex-direction:column}
.icon-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line2);color:var(--ink2);transition:.15s}
.icon-btn.call{color:var(--good)}
.icon-btn:active{transform:scale(.9)}
.pick-row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 4px;border-bottom:1px solid var(--line);text-align:right}
.pick-row:active{background:var(--card2)}
.pick-row b{flex:1;font-size:14px;display:block}
.pick-row span{font-size:11px;color:var(--ink3);display:block;margin-top:2px}
.page-add{margin-top:18px}
.dec{margin-top:12px;overflow:hidden}
.dec-head{display:flex;align-items:center;gap:11px;padding:14px 15px;cursor:pointer}
.dec-ic{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;color:var(--acc);background:var(--card2);border:1px solid var(--line)}
.dec-b{flex:1;min-width:0}
.dec-b b{font-size:14.5px;display:block}
.dec-b span{font-size:11.5px;color:var(--ink3)}
.dec-badge{flex:none;font-size:10.5px;font-weight:600;padding:4px 10px;border-radius:100px;border:1px solid currentColor}
.dec-badge.b-ok{color:var(--good)}.dec-badge.b-mid{color:var(--acc)}.dec-badge.b-no{color:var(--bad)}
.dec-chev{color:var(--ink3);transition:transform .25s;flex:none}
.dec.open .dec-chev{transform:rotate(90deg)}
.dec-body{display:none;padding:2px 15px 15px;border-top:1px solid var(--line)}
.dec.open .dec-body{display:block;animation:viewIn .3s ease}
.dec-summ{font-size:12.5px;color:var(--ink2);line-height:1.8;padding:11px 0 4px}
.dec-cols{display:flex;gap:14px;margin-top:8px}
.dec-cols>div{flex:1}
.dec-cols h5,.dec-q h5{font-size:11.5px;color:var(--ink2);margin-bottom:6px;display:flex;gap:5px;align-items:center}
.dec-cols h5 .ic{color:var(--good)}
.dec-cols div:last-child h5 .ic{color:var(--bad)}
.dec-cols ul{list-style:none}
.dec-cols li,.dec-q li{font-size:12px;line-height:1.7;padding:3px 0;color:var(--ink);position:relative;padding-right:12px}
.dec-cols li::before,.dec-q li::before{content:'';position:absolute;right:0;top:12px;width:5px;height:5px;border-radius:50%;background:var(--line2)}
.dec-q{margin-top:12px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.dec-q li::before{background:var(--acc)}
.dec-verdict{margin-top:12px;font-size:13px;line-height:1.8;border-right:3px solid var(--acc);padding:8px 12px;background:var(--card2);border-radius:0 10px 10px 0}
.dec-acts{display:flex;gap:8px;margin-top:13px}
.dec-acts .btn{padding:10px;font-size:12.5px}
.chat-head{display:flex;align-items:center;gap:11px;padding:14px 18px 11px;border-bottom:1px solid var(--line)}
.chat-av{width:40px;height:40px;border-radius:50%;background:var(--card2);border:1.5px solid var(--acc);display:grid;place-items:center;color:var(--acc)}
.chat-head b{font-family:var(--fd);font-size:15px;display:block}
.chat-head span{font-size:11px;color:var(--ink3)}
#chatList{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 6px;scrollbar-width:none}
#chatList::-webkit-scrollbar{display:none}
.msg{max-width:84%;padding:10px 14px;border-radius:16px;font-size:13.5px;line-height:1.8;margin-bottom:9px;white-space:pre-wrap;word-break:break-word}
.msg.rf{margin-left:auto;background:var(--card2);border:1px solid var(--line);border-top-right-radius:5px}
.msg.me{margin-right:auto;background:var(--me-bg);border:1px solid var(--me-line);border-top-left-radius:5px}
.msg-act{display:inline-block;margin:4px 4px 0 0;font-size:12px;font-weight:600;color:var(--acc);border:1px solid var(--line2);border-radius:100px;padding:6px 13px}
.typing{display:inline-flex;gap:4px;padding:13px 16px;background:var(--card2);border:1px solid var(--line);border-radius:16px;border-top-right-radius:5px;margin-bottom:9px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink3);animation:tp 1s ease infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.chat-sugs{display:flex;gap:7px;overflow-x:auto;padding:9px 16px 3px;scrollbar-width:none}
.chat-sugs .chip{flex:none;font-size:12px;padding:7px 13px}
.composer{display:flex;gap:9px;align-items:center;padding:11px 14px calc(env(safe-area-inset-bottom) + 12px);border-top:1px solid var(--line);background:var(--panel)}
.composer input{flex:1}

const STORES=['events','rels','decisions','chat','meta'];
const DB={driver:'mem',ok:false,_m:{},_idb:null,
 async open(){
  try{
   const db=await new Promise((res,rej)=>{
    if(typeof indexedDB==='undefined'){rej(new Error('no idb'));return}
    const r=indexedDB.open('rafiq-db',1);
    r.onupgradeneeded=e=>{const d=e.target.result;STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:s==='meta'?'key':'id'})})};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'))});
   DB._idb=db;DB.driver='idb';DB.ok=true;
   for(let i=0;i<STORES.length;i++){const s=STORES[i];
    DB._m[s]=await new Promise((res,rej)=>{const q=db.transaction(s).objectStore(s).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error)})}
   return;
  }catch(e){}
  try{
   localStorage.setItem('rafiq__probe','1');localStorage.removeItem('rafiq__probe');
   DB.driver='ls';DB.ok=true;
   STORES.forEach(s=>{try{DB._m[s]=JSON.parse(localStorage.getItem('rafiq:'+s)||'[]')}catch(e2){DB._m[s]=[]}if(!Array.isArray(DB._m[s]))DB._m[s]=[]});
   return;
  }catch(e){}
  DB.driver='mem';DB.ok=false;STORES.forEach(s=>DB._m[s]=[]);
 },
 _keyOf(s,o){return s==='meta'?o.key:o.id},
 all(s){return Promise.resolve((DB._m[s]||[]).slice())},
 async put(s,o){
  const arr=DB._m[s]||(DB._m[s]=[]);const k=DB._keyOf(s,o);
  let f=false;for(let i=0;i<arr.length;i++){if(DB._keyOf(s,arr[i])===k){arr[i]=o;f=true;break}}
  if(!f)arr.push(o);
  if(DB.driver==='idb'&&DB._idb){try{await new Promise((res,rej)=>{const q=DB._idb.transaction(s,'readwrite').objectStore(s).put(o);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)})}catch(e){}}
  else if(DB.driver==='ls')DB._lsSave(s);
  return o;
 },
 async del(s,key){
  const arr=DB._m[s]||(DB._m[s]=[]);
  for(let i=0;i<arr.length;i++){if(DB._keyOf(s,arr[i])===key){arr.splice(i,1);break}}
  if(DB.driver==='idb'&&DB._idb){try{await new Promise((res,rej)=>{const q=DB._idb.transaction(s,'readwrite').objectStore(s).delete(key);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)})}catch(e){}}
  else if(DB.driver==='ls')DB._lsSave(s);
 },
 async clear(s){
  DB._m[s]=[];
  if(DB.driver==='idb'&&DB._idb){try{await new Promise((res,rej)=>{const q=DB._idb.transaction(s,'readwrite').objectStore(s).clear();q.onsuccess=()=>res();q.onerror=()=>rej(q.error)})}catch(e){}}
  else if(DB.driver==='ls')DB._lsSave(s);
 },
 _lsSave(s){try{localStorage.setItem('rafiq:'+s,JSON.stringify(DB._m[s]||[]))}catch(e){}}
};

function catScoreAt(c,until){let s=50;S.events.forEach(e=>{if(e.category!==c||e.ts>=until||e.ts<until-30*DAY)return;

function calcStreak(){

 if(!S.events.some(e=>dayStart(e.ts)===d0))d0-=DAY;
 while(S.events.some(e=>dayStart(e.ts)===d0)){st++;d0-=DAY}
 return st;
}

 if(ev.polarity>0&&((ev.mood||0)>=6||/أنجزت|إنجاز|نجحت|ترقية|تخرج|زواج|ربحت/.test(ev.text))){

 S.mem.interests.sort((a,b)=>b.weight-a.weight);if(S.mem.interests.length>20)S.mem.interests.length=20;

}

/* ====== التوجيه الواحد (محور 3 — قابل للتعديل من البيانات) ====== */
function guideOrderDefault(){return ['rel','energy','procrast','logging','growth']}
function computeGuidance(){
 const iso=isoDate(Date.now());
 if(S.settings.guidance&&S.settings.guidance.date===iso&&!S.settings.guidance.done)return S.settings.guidance;
 const order=(S.settings.guideOrder&&S.settings.guideOrder.length)?S.settings.guideOrder:guideOrderDefault();
 const AR=LANG==='ar';
 const skip=S.settings.gSkip;
 let g=null;
 for(let oi=0;oi<order.length;oi++){
  const k=order[oi];
  if(skip&&skip.kind===k&&Date.now()<(skip.until||0))continue;
  if(k==='rel'){const r=S.staleRels[0];
   if(r){g={kind:'rel',label:t('rec_rel_t')+r.name,why:t('rec_rel_a')+daysSince(r.lastContact)+' '+pd(daysSince(r.lastContact))+t('rec_rel_b'),act:'openPick'};break}}
  else if(k==='energy'){const ys=S.events.filter(e=>e.type==='selfrate').sort((a,b)=>b.ts-a.ts);
   const y=ys.length?ys[0]:null;
   if(y&&y.ps&&y.ps.energy&&y.ps.energy<=2&&daysSince(y.ts)<=2){g={kind:'energy',label:AR?'يوم استعادة — ربما مشي 20 دقيقة يكفي':'Recovery day — maybe 20 min walk',why:AR?'لاحظت طاقة منخفضة أمس — الاستعادة قرار بحد ذاتها':'Low energy yesterday — recovery is a decision',act:'quick',text:AR?'مشيت 20 دقيقة':'Walked 20 minutes',cat:'health'};break}}
  else if(k==='procrast'){const its=S.events.filter(e=>e.type==='interest'&&!e.done);let worst=null;
   its.forEach(x=>{if(!worst||x.ts<worst.ts)worst=x});
   if(worst&&daysSince(worst.ts)>=3){g={kind:'procrast',label:worst.text,why:AR?'ربما أجّلته أكثر من مرة — دقيقتان اليوم قد تكسران الحلقة':'Maybe postponed — two minutes may break the loop',act:'toggleIn',id:worst.id};break}}
  else if(k==='logging'){const acts=S.events.filter(e=>e.type!=='mood'&&e.type!=='promise'&&e.type!=='selfrate'&&e.type!=='interest');
   const last=acts.length?acts[acts.length-1]:null;
   if(!last||daysSince(last.ts)>=2){g={kind:'logging',label:AR?'وثّق لحظة واحدة — ولو سطراً':'Log one moment — one line',why:AR?'الذاكرة أولاً — بلا توثيق لا فهم':'Memory first — no log, no understanding',act:'openPanel'};break}}
 }
 if(!g)g={kind:'growth',label:AR?'يومك صامد — ربما جرّب شيئاً جديداً صغيراً':'Try something small and new',why:AR?'التوازن أفضل وقت للنمو':'Balance is growth time',act:'openEvent'};
 g.date=iso;g.done=false;
 S.settings.guidance=g;saveMeta();
 return g;
}

function todayRate(){
 const ds=dayStart(Date.now());
 return S.events.find(e=>e.type==='selfrate'&&e.ts>=ds)||null;
}
function rateScore(ev){
 if(!ev||!ev.ps)return null;
 const vals=PS_DIMS.map(d=>{const raw=ev.ps[d.id]||0;if(raw===0)return 0;return d.inv?(6-raw)*20:raw*20});
 if(vals.some(v=>v===0))return null;
 return Math.round(vals.reduce((a,b)=>a+b,0)/7);
}
function rateGapInfo(){
 const r=todayRate();const sc=rateScore(r);
 const ds=dayStart(Date.now());
 const acts=S.events.filter(e=>e.ts>=ds&&e.type!=='mood'&&e.type!=='selfrate'&&e.type!=='promise'&&e.type!=='interest');
 const pos=acts.filter(e=>e.polarity>0).length,neg=acts.filter(e=>e.polarity<0).length;
 if(sc===null||!acts.length)return {sc:sc,kind:'nodata'};
 const eventScore=clamp(Math.round(50+(pos-neg)*12),5,100);
 const gap=sc-eventScore;
 if(gap>=18)return {sc:sc,kind:'up'};
 if(gap<=-18)return {sc:sc,kind:'dn'};
 return {sc:sc,kind:'close'};
}

 const ds=dayStart(Date.now());

function twinData(){
 const n=S.events.length,attN=S.events.filter(e=>e.att&&e.att.length).length;
 const compl=clamp(Math.round(n*1.6+S.rels.length*4+S.decisions.length*4+attN*3+S.chat.length*.5),4,100);
 const posBy={},negBy={};CATS.forEach(c=>{posBy[c]=0;negBy[c]=0});
 S.events.forEach(e=>{if(!(e.category in posBy))return;if(e.polarity>0)posBy[e.category]++;if(e.polarity<0)negBy[e.category]++});
 const energy=CATS.reduce((a,c)=>posBy[c]>posBy[a]?c:a,'health');
 const stress=CATS.reduce((a,c)=>negBy[c]>negBy[a]?c:a,'health');
 const hours=S.events.map(e=>new Date(e.ts).getHours());
 const avgH=hours.length?hours.reduce((a,b)=>a+b,0)/hours.length:9;
 const when=avgH<12?t('hour_m'):avgH<18?t('hour_d'):t('hour_n');
 const sorted=[].slice.call(CATS).sort((a,b)=>S.ind[b]-S.ind[a]);
 const TR={health:['تعتني بجسدك','care for your body'],relations:['تُقدّم أهلَك','cherish family'],money:['واعٍ مالياً','money-aware'],work:['طموح في مسيرتك','ambitious'],mind:['تحرص على صفائك','guard calm'],growth:['شغوف بالنمو','thrive on growth']};
 const idPlain=LANG==='ar'
  ?'أنت شخص '+TR[sorted[0]][0]+'، و'+TR[sorted[1]][0]+'. وجانب '+cn(sorted[5])+' ينتظر اهتمامك — ربما.'
  :'You '+TR[sorted[0]][1]+', and '+TR[sorted[1]][1]+'. Your '+cn(sorted[5])+' side asks — maybe.';
 const total=Math.max(1,S.events.filter(e=>e.type!=='mood'&&e.type!=='promise'&&e.type!=='selfrate'&&e.type!=='interest').length);
 const dist=CATS.map(c=>({c:c,pct:Math.round(S.events.filter(e=>e.category===c&&e.type!=='mood'&&e.type!=='promise'&&e.type!=='selfrate'&&e.type!=='interest').length/total*100)}));
 const wdPos=[0,0,0,0,0,0,0];
 S.events.forEach(e=>{if(e.polarity>0)wdPos[new Date(e.ts).getDay()]++});
 const bestWd=wdPos.indexOf(Math.max.apply(null,wdPos));
 const streak=calcStreak();
 const cnt={};S.events.forEach(e=>{if(e.polarity<=0)return;const s=' '+e.text+' ';
  (KW[e.category]||[]).forEach(w=>{if(s.indexOf(w)>=0)cnt[w]=(cnt[w]||0)+1})});
 const topW=Object.keys(cnt).map(k=>[k,cnt[k]]).sort((a,b)=>b[1]-a[1])[0]||null;
 const evs=[].slice.call(S.events).sort((a,b)=>a.ts-b.ts);let recSum=0,recN=0;
 evs.forEach((e,i)=>{if(e.polarity<0){for(let j=i+1;j<evs.length;j++){if(evs[j].polarity>0){
  const gap=Math.floor((dayStart(evs[j].ts)-dayStart(e.ts))/DAY);
  if(gap>=0&&gap<=4){recSum+=gap;recN++}break}}}});
 const rec=recN?Math.max(1,Math.round(recSum/recN)):null;
 const sp=S.spark,mx=6.5,my=sp.reduce((a,b)=>a+b,0)/sp.length;
 let num=0,den=0;sp.forEach((v2,i)=>{num+=(i-mx)*(v2-my);den+=(i-mx)*(i-mx)});
 const slope=den?num/den:0,proj=clamp(Math.round(my+slope*(20-mx)),0,100),projD=proj-S.life;
 return {compl:compl,energy:energy,energyN:posBy[energy],stress:stress,stressN:negBy[stress],when:when,idPlain:idPlain,dist:dist,avgH:avgH,wdPos:wdPos,bestWd:bestWd,streak:streak,topW:topW,rec:rec,proj:proj,projD:projD};
}

 const ring=k=>CATS.map((c,i)=>{const a=(-90+i*60)*Math.PI/180;return (cx+r*k*Math.cos(a)).toFixed(1)+','+(cy+r*k*Math.sin(a)).toFixed(1)}).join(' ');

 const labels=CATS.map((c,i)=>{const a=(-90+i*60)*Math.PI/180;return '<text x="'+(cx+(r+21)*Math.cos(a)).toFixed(1)+'" y="'+(cy+(r+21)*Math.sin(a)+4).toFixed(1)+'" fill="'+CAT_META[c].color+'" class="hex-lab">'+cn(c)+'</text>'}).join('');
 return '<svg viewBox="0 0 320 300" class="hex"><polygon points="'+ring(1)+'" class="hex-grid"/><polygon points="'+ring(.66)+'" class="hex-grid"/><polygon points="'+ring(.33)+'" class="hex-grid"/>'+spokes+'<polygon id="hexPoly" class="hex-val"/>'+CATS.map((c,i)=>'<circle id="hexDot'+i+'" r="4" fill="'+CAT_META[c].color+'"/>').join('')+labels+'</svg>';

function drawHex(vals){
 const cx=160,cy=150,r=104;
 const pts=vals.map((v2,i)=>{const a=(-90+i*60)*Math.PI/180,rr=r*v2/100;return [cx+rr*Math.cos(a),cy+rr*Math.sin(a)]});
 const poly=$('#hexPoly');if(poly)poly.setAttribute('points',pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' '));
 pts.forEach((p,i)=>{const d=$('#hexDot'+i);if(d){d.setAttribute('cx',p[0].toFixed(1));d.setAttribute('cy',p[1].toFixed(1))}});
}
function hexTween(from,to){const t0=performance.now(),dur=800;(function f(tm){const k=Math.min(1,(tm-t0)/dur),e=1-Math.pow(1-k,3);drawHex(from.map((f0,i)=>f0+(to[i]-f0)*e));if(k<1)requestAnimationFrame(f)})(t0)}
function sparkSvg(arr){
 const w=300,h=72,pad=7,mn=Math.min.apply(null,arr)-3,mx=Math.max.apply(null,arr)+3;
 const xs=i=>pad+i*(w-2*pad)/(arr.length-1),ys=v2=>h-pad-(v2-mn)*(h-2*pad)/(mx-mn);
 const pts=arr.map((v2,i)=>xs(i).toFixed(1)+','+ys(v2).toFixed(1));
 return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%"><polygon points="'+pad+','+(h-pad)+' '+pts.join(' ')+' '+(w-pad)+','+(h-pad)+'" fill="var(--acc-soft)"/><polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--acc)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+xs(arr.length-1).toFixed(1)+'" cy="'+ys(arr[arr.length-1]).toFixed(1)+'" r="4" fill="var(--acc)"/></svg>';
}

async function compressImage(dataURL,max,q){
 max=max||1000;q=q||.72;
 const img=new Image();
 await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=dataURL});
 let w=img.width,h=img.height;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
 const c=document.createElement('canvas');c.width=w;c.height=h;
 c.getContext('2d').drawImage(img,0,0,w,h);
 return c.toDataURL('image/jpeg',q);
}

function startVoice(){

 if(mb&&mb.classList.contains('on')){try{if(window.__rfRec)window.__rfRec.stop()}catch(e){}return}

 if(!SR){toast(t('voice_bad'),'var(--acc)','mic');return}
 const mh=$('#micHint');
 try{
  const r=new SR();window.__rfRec=r;
  r.lang=LANG==='ar'?'ar-SA':'en-US';r.continuous=true;r.interimResults=true;
  let base=evText.value.trim()?evText.value.trim()+' ':'';
  if(mb)mb.classList.add('on');if(mh)mh.textContent=t('voice_on');
  r.onresult=e=>{let fin='',inter='';
   for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)fin+=e.results[i][0].transcript+' ';else inter+=e.results[i][0].transcript}
   if(fin)base+=fin;
   evText.value=(base+inter).replace(/\s+/g,' ').trim();
   evText.dispatchEvent(new Event('input'))};
  r.onend=()=>{if(mb)mb.classList.remove('on');if(mh)mh.textContent=t('voice');window.__rfRec=null};
  r.onerror=()=>{if(mb)mb.classList.remove('on');if(mh)mh.textContent=t('voice_err');window.__rfRec=null};
  r.start();
 }catch(err){toast(t('voice_bad'),'var(--acc)','mic')}
}

function buildStory(range){
 const days=range==='week'?7:30;
 const start=dayStart(Date.now())-(days-1)*DAY;
 const evs=S.events.filter(e=>e.ts>=start&&e.type!=='mood'&&e.type!=='promise'&&e.type!=='selfrate'&&e.type!=='interest').sort((a,b)=>a.ts-b.ts);
 const AR=LANG==='ar';
 if(evs.length<2)return null;
 const pos=evs.filter(e=>e.polarity>0);
 const neg=evs.filter(e=>e.polarity<0);
 const moods=S.events.filter(e=>e.type==='mood'&&e.ts>=start);
 const avg=moods.length?moods.reduce((a,e)=>a+e.mood,0)/moods.length:null;
 const best=pos.length?(pos.reduce((a,b)=>((b.mood||0)>(a.mood||0)?b:a))):null;
 const rel=pos.filter(e=>e.category==='relations');const human=rel.length?rel[rel.length-1]:null;
 const grw=pos.filter(e=>e.category==='growth');const grow=grw.length?grw[grw.length-1]:null;
 const name=S.profile.name||(AR?'صديقي':'friend');
 const period=range==='week'?t('story_week'):t('story_month');
 let s='«'+t('story_t')+period+'»\n\n';
 s+=(AR?('يا '+name+'، خُضت خلال هذه الفترة '+evs.length+' لحظة موثقة'):('Dear '+name+', '+evs.length+' documented moments'));
 if(avg)s+=(AR?('، ومزاجك العام كان «'+mw(Math.round(avg))+'»'):(', mood "'+mw(Math.round(avg))+'"'));
 s+='.\n\n';
 if(best)s+=(AR?('أجمل لحظة: «'+best.text+'» — '+fmtShort(best.ts)+'.'):('Most beautiful: "'+best.text+'". '))+'\n';
 if(human&&(!best||human.id!==best.id))s+=(AR?('وقلبك كان في مكانه حين «'+human.text+'».\n'):('Heart right: "'+human.text+'".\n'));
 if(neg.length){s+=(AR?('وما يومٌ بلا ثقل: «'+neg[0].text+'». لكنك عادت للضوء.\n'):('No week without weight. You returned to light.\n'));}
 if(grow&&(!best||grow.id!==best.id))s+=(AR?('ونموك لم يتوقف: «'+grow.text+'».\n'):('Growth never paused.\n'));
 s+='\n'+(AR?('الخلاصة: '+lifeWord(S.life)+' — '+S.life+'/100.'):('In sum: '+S.life+'/100.'))+'\n\n'+t('story_sign');
 return s;
}

  if(navigator.canShare&&navigator.canShare({files:[file]})){
   await navigator.share({files:[file],title:'rafiq-backup.json'});
   toast(t('exp_share'),'var(--good)','download');return;}
 }catch(err){if(err&&err.name==='AbortError')return}
 const blob=new Blob([txt],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rafiq-backup.json';
 document.body.appendChild(a);a.click();
 setTimeout(()=>{if(a.parentNode)a.parentNode.removeChild(a);URL.revokeObjectURL(a.href)},4000);
 toast(t('exp_ok'),'var(--good)','download');
}
 $('#importFile').addEventListener('change',async e=>{
 const f=e.target.files[0];if(!f)return;
 try{
  const data=JSON.parse(await fileToText(f));
  if(!data.app||!Array.isArray(data.events))throw new Error('bad');
  const sts=['events','rels','decisions','chat'];
  for(let i=0;i<sts.length;i++)await DB.clear(sts[i]);
  for(const ev of data.events)await DB.put('events',ev);
  for(const r of (data.rels||[]))await DB.put('rels',r);
  for(const d of (data.decisions||[]))await DB.put('decisions',d);
  for(const c of (data.chat||[]))await DB.put('chat',c);
  if(data.meta)await DB.put('meta',{key:'main',profile:data.meta.profile||{},reminders:data.meta.reminders||[],seeded:data.meta.seeded,settings:data.meta.settings});
  if(data.memory)await DB.put('meta',{key:'memory',data:data.memory});
  S.settings=Object.assign({lang:'ar',theme:'dark',accent:'amber',toggles:{rel:true,habits:true},a2hsDone:false,pin:'',pinOn:false,secQ:'',secA:'',guidance:null,guideOrder:null,gSkip:null,metrics:null,joyOpen:''},(data.meta&&data.meta.settings)||{});
  if(!S.settings.toggles)S.settings.toggles={rel:true,habits:true};
  LANG=S.settings.lang||'ar';
  applyLang();applyTheme();
  await loadAll();await memLoad();buildShell();refresh();
  toast(t('imp_ok'),'var(--good)','upload');
 }catch(err){toast(t('imp_err'),'var(--bad)','x')}
 e.target.value='';
});
async function wipeDemo(){
 const sts=['events','rels','decisions','chat'];
 for(let i=0;i<sts.length;i++){const all=await DB.all(sts[i]);
  for(const o of all)if(o.seed)await DB.del(sts[i],o.id)}
 await memLoad();await loadAll();refresh();
 toast(t('wipe_ok'),'var(--acc)','spark');
}
async function wipeAll(){
 const sts=['events','rels','decisions','chat','meta'];
 for(let i=0;i<sts.length;i++)await DB.clear(sts[i]);
 location.reload();
}

/* درع الذاكرة */
async function shieldLast(){try{const all=await DB.all('meta');const back=all.find(x=>x.key==='backup-log');return back?back.ts:0}catch(e){return 0}}
async function shieldMaybe(){
 if(S.events.filter(e=>e.type!=='mood'&&e.type!=='promise'&&e.type!=='selfrate'&&e.type!=='interest').length<5)return;
 const last=await shieldLast();
 if(last&&(Date.now()-last)<7*DAY)return;
 setTimeout(()=>{toast(t('shield_t'),'var(--good)','shield',t('shield_go'),async()=>{await exportBackup();await DB.put('meta',{key:'backup-log',ts:Date.now()})},9000)},1800);
}

/* شرارة */
const SPARKS={
 health:{books:{ar:['العادات الذرية — جيمس كلير'],en:['Atomic Habits']},acts:{ar:['امشِ بعد كل وجبة 10 دقائق','قاعدة الدقيقتين'],en:['Walk after meals','Two-minute rule']}},
 growth:{books:{ar:['العمل العميق — كال نيوبورت'],en:['Deep Work']},acts:{ar:['اكتب ما تعلمته من آخر خطأ'],en:['Write your last lesson']}},
 relations:{books:{ar:['كيف تكسب الأصدقاء'],en:['How to Win Friends']},acts:{ar:['رسالة شكر لشخص لم تكافئه'],en:['Thank someone unthanked']}},
 money:{books:{ar:['أغنى رجل في بابل'],en:['Richest Man in Babylon']},acts:{ar:['قاعدة 24 ساعة للشراء'],en:['24-hour rule']}},
 work:{books:{ar:['أشياء أساسية'],en:['Essentialism']},acts:{ar:['90 دقيقة عميقة دون إشعارات'],en:['90-min deep block']}},
 mind:{books:{ar:['قوة الآن'],en:['The Power of Now']},acts:{ar:['ثلاثة أشياء ممتن لها الآن'],en:['Three gratitudes now']}}};
function sparkOfTheDay(){
 const AR=LANG==='ar';const iso=isoDate(Date.now());
 const weak=[].slice.call(CATS).sort((a,b)=>S.ind[a]-S.ind[b])[0]||'mind';
 const pool=SPARKS[weak]||SPARKS.mind;
 const ki=(Number(String(iso).split('-').join(''))%2===0)?'books':'acts';
 const arr=pool[ki][AR?'ar':'en'];
 const seed=String(iso+(S.profile.name||'x')).split('').reduce((a,c)=>a+c.charCodeAt(0),0);
 return {cat:weak,text:arr[seed%arr.length],kind:ki==='books'?t('spk_book'):t('spk_act')};
}
function sparkCard(){const s=sparkOfTheDay();
 return '<div class="card" style="padding:13px 15px;margin-top:12px;cursor:pointer" data-act="sparkAct"><div class="spk-top"><span class="spk-ic">'+ic('spark',18)+'</span><div class="spk-body"><b>'+t('spk_t')+'</b><p>'+esc(s.text)+'</p></div><span class="spk-kind">'+esc(s.kind)+'</span></div></div>';}

/* تحدي */
function weekKey(){return isoDate(Date.now()-new Date().getDay()*DAY)}
function chProgress(key){const start=dayStart(Date.now())-new Date().getDay()*DAY;
 const evs=S.events.filter(e=>e.ts>=start);
 if(key==='contact')return evs.filter(e=>e.type==='contact').length;
 if(key==='health')return evs.filter(e=>e.category==='health'&&e.polarity>0).length;
 if(key==='growth')return evs.filter(e=>e.category==='growth'&&e.polarity>0).length;
 if(key==='pos')return evs.filter(e=>e.polarity>0).length;
 return 0;}
function weeklyChallenge(){const st=S.settings.challenge;
 if(st&&st.week===weekKey())return {key:st.key,target:st.target,done:chProgress(st.key),week:st.week,label:st.label};
 return null;}
function suggestChallenge(){const weak=[].slice.call(CATS).sort((a,b)=>S.ind[a]-S.ind[b])[0];
 const AR=LANG==='ar';
 const map={relations:{key:'contact',target:3,label:AR?'ثلاثة تواصلات هذا الأسبوع':'Three contacts'},health:{key:'health',target:3,label:AR?'ثلاث لحظات صحية':'Three health moments'},growth:{key:'growth',target:3,label:AR?'ثلاث لحظات نمو':'Three growth moments'},money:{key:'pos',target:4,label:AR?'أربع لحظات إيجابية':'Four positive'},mind:{key:'pos',target:4,label:AR?'أربع لحظات إيجابية':'Four positive'},work:{key:'pos',target:4,label:AR?'أربع لحظات إيجابية':'Four positive'}};
 return map[weak]||map.mind;}
async function acceptChallenge(){const c=suggestChallenge();
 S.settings.challenge={key:c.key,target:c.target,label:c.label,week:weekKey()};
 await saveMeta();refresh();toast(t('ch_ok'),'var(--acc)','flame');}
function challengeCard(){const c=weeklyChallenge();
 if(c){const pct=Math.min(100,Math.round(c.done/c.target*100));
  return '<div class="ch-card" style="margin-top:12px"><div class="ch-top"><span class="spk-ic">'+ic('flame',18)+'</span><div style="flex:1"><b>'+esc(c.label)+'</b><span>'+t('ch_week_t')+'</span></div></div><div class="ch-bar"><i style="width:'+pct+'%"></i></div><div class="ch-foot"><span>'+c.done+' / '+c.target+'</span>'+(pct>=100?'<b style="color:var(--good)">✓ '+t('ch_done')+'</b>':'<span></span>')+'</div></div>';}
 const sc=suggestChallenge();
 return '<div class="ch-card" style="margin-top:12px;cursor:pointer" data-act="acceptCh"><div class="ch-top"><span class="spk-ic">'+ic('flame',18)+'</span><div style="flex:1"><b>'+t('ch_await')+'</b><span>'+esc(sc.label)+'</span></div><button class="rec-btn">'+t('ch_accept')+'</button></div></div>';}
function interestAccuracy(){const start=dayStart(Date.now())-new Date().getDay()*DAY;
 const all=S.events.filter(e=>e.type==='interest'&&e.ts>=start);
 if(all.length<3)return null;
 return Math.round(all.filter(e=>e.done).length/all.length*100);}
async function toggleInterest(id){const p=S.events.find(x=>x.id===id&&x.type==='interest');if(!p)return;
 if(!p.done){p.done=true;p.doneTs=Date.now();await DB.put('events',p);
  toast(t('pd_saved'),'var(--good)','star',null,null,3000)}
 else{p.done=false;p.doneTs=0;await DB.put('events',p)}
 refresh();}

window.__rfStage='فتح قاعدة البيانات';
(async function init(){
 try{
  await DB.open();
  window.__rfStage='قراءة البيانات';
  let m=null;
  try{m=(await DB.all('meta')).find(x=>x.key==='main')}catch(e){}
  S.settings=Object.assign({lang:'ar',theme:'dark',accent:'amber',toggles:{rel:true,habits:true},a2hsDone:false,pin:'',pinOn:false,secQ:'',secA:'',guidance:null,guideOrder:null,gSkip:null,metrics:null,joyOpen:''},(m&&m.settings)||{});
  if(!S.settings.toggles)S.settings.toggles={rel:true,habits:true};
  LANG=S.settings.lang||'ar';
  applyLang();applyTheme();
  buildLockPad();
  window.__rfStage='بناء الشاشات';
  buildShell();
  if(m&&m.profile){
   S.profile=Object.assign(S.profile,m.profile||{});
   S.reminders=(m&&m.reminders)||[];
   await loadAll();await memLoad();computeAll();renderDot();enterApp(false);
  }else renderOb();
  metricsTick();
  if(S.settings.pin&&S.settings.pinOn)showLock();
  else setTimeout(shieldMaybe,2600);
 }catch(err){__rfErr((err&&err.message||err)+' @init')}
})();
function enterApp(seeded){
 killSplash();
 const ob=$('#ob');if(ob)ob.style.display='none';
 const app=$('#app');if(app)app.hidden=false;
 computeAll();renderDot();go('home');
 if(seeded)setTimeout(()=>toast(t('seed_ready')+(S.profile.name||'')+t('seed_ready2'),'var(--acc)','spark'),700);
}
window.__rfBooted=true;
</script>
